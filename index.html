<!DOCTYPE html>
<html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>簡易計算機</title><link rel="stylesheet" href="style.css"></head>
<body><main class="calculator"><h1>計算機</h1><div id="display" class="display" aria-live="polite">0</div>
<div class="memory-buttons"><button onclick="memoryAdd()">M+</button><button onclick="memorySubtract()">M-</button><button onclick="memoryRecall()">MR</button><button onclick="memoryClear()">MC</button></div>
<div class="buttons">
<button onclick="clearDisplay()">C</button><button onclick="calculatePercentage()">%</button><button onclick="appendToDisplay('/')">/</button><button onclick="deleteLast()">←</button>
<button onclick="appendToDisplay('7')">7</button><button onclick="appendToDisplay('8')">8</button><button onclick="appendToDisplay('9')">9</button><button onclick="appendToDisplay('*')">×</button>
<button onclick="appendToDisplay('4')">4</button><button onclick="appendToDisplay('5')">5</button><button onclick="appendToDisplay('6')">6</button><button onclick="appendToDisplay('-')">−</button>
<button onclick="appendToDisplay('1')">1</button><button onclick="appendToDisplay('2')">2</button><button onclick="appendToDisplay('3')">3</button><button class="equals" onclick="calculate()">=</button>
<button class="zero" onclick="appendToDisplay('0')">0</button><button onclick="appendToDisplay('.')">.</button><button onclick="appendToDisplay('+')">+</button></div>
<p id="memory-status" class="memory-status" aria-live="polite">記憶：0</p></main><script src="script.js"></script></body></html>
